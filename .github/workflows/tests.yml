name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run critical Flake8 checks
        run: |
          flake8 src api tests app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run test suite
        run: python -m pytest -v

  docker:
    name: Docker Build and API Smoke Test
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t safety-risk-predictor:ci \
            .

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name safety-api \
            --publish 8000:8000 \
            safety-risk-predictor:ci

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs safety-api
          exit 1

      - name: Verify model info
        run: |
          curl --fail http://127.0.0.1:8000/model-info

      - name: Test prediction endpoint
        run: |
          curl --fail \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{
              "SA": 0.70,
              "SK": 0.75,
              "SN": 0.68,
              "BA": 0.72,
              "PBC": 0.70,
              "reference_point": 0.60,
              "alpha": 0.88,
              "beta": 0.88,
              "lam": 1.18,
              "day": 50
            }' \
            http://127.0.0.1:8000/predict

      - name: Show container logs on failure
        if: failure()
        run: docker logs safety-api || true

      - name: Stop container
        if: always()
        run: docker rm --force safety-api || true
